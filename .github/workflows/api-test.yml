steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Test
        # Lệnh này khắc phục lỗi 401 (nhờ truyền token) và lỗi vòng lặp (nhờ -d users.csv)
        run: newman run Collection.json -e Environment.json -d users.csv --env-var "token=${{ secrets.GOREST_TOKEN }}"
